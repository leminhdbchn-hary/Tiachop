name: Tạo giọng đọc AI
on:
  workflow_dispatch:
  push:
    paths:
      - "cars/**"
      - "tools/phrases.json"
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts pillow pillow-heif
      - run: python3 tools/build_cars.py
      - run: python3 tools/make_audio.py
      - name: Lưu ảnh và file âm thanh vào repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A cars audio
          git diff --cached --quiet || git commit -m "Cập nhật ảnh ô tô và giọng đọc AI"
          git pull --rebase
          git push
