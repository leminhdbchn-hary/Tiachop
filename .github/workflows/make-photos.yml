name: Tải ảnh thật cho game
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/photo_items.json"
      - "photos/skip.txt"
      - "photos/overrides.txt"
permissions:
  contents: write
concurrency:
  group: photos
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python3 tools/fetch_photos.py
      - name: Lưu ảnh vào repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A photos
          git diff --cached --quiet || git commit -m "Cập nhật ảnh thật cho game"
          git pull --rebase
          git push
