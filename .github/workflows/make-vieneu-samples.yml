name: Trang nghe thử giọng VieNeu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/make_vieneu_samples.py"
      - ".github/workflows/make-vieneu-samples.yml"
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y ffmpeg
      - run: pip install vieneu
      - run: python3 tools/make_vieneu_samples.py
      - name: Lưu trang nghe thử vào repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add voicetest/vieneu
          git diff --cached --quiet || git commit -m "Thêm trang nghe thử giọng VieNeu"
          git pull --rebase
          git push
