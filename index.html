<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Vui Học</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bé Vui Học">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8FD3F8">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#25234A; --sky:#8FD3F8; --sky2:#D6F1FF; --paper:#FFFFFF;
  --yellow:#FFC93C; --red:#FF6B6B; --mint:#35C9B5; --lilac:#B9A2FF; --green:#4CD07D; --orange:#FF9F45; --blue:#6BB8FF;
  --bgtext:#25234A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#2B2766; --sky2:#3D378C; --ink:#0F0D2E; --bgtext:#FFFFFF; }
}
:root[data-theme="dark"]{ --sky:#2B2766; --sky2:#3D378C; --ink:#0F0D2E; --bgtext:#FFFFFF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  margin:0;height:100%;
  font-family:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:5px solid var(--yellow);outline-offset:3px}

#app{height:100%;display:flex;flex-direction:column;max-width:920px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;min-height:60px}
.icon{
  min-width:56px;height:56px;border-radius:18px;background:var(--paper);
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);
  font-size:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;
}
.icon:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.icon.pill{font-size:16px;font-weight:800}
.icon.big{min-width:68px;height:68px;font-size:34px;background:var(--yellow);flex:none}
.icon[hidden]{display:none}
.progress{flex:1;min-width:0;padding-top:16px}
.road{position:relative;height:40px;border:4px solid var(--ink);border-radius:16px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 26px) 0 50%/100% 4px no-repeat,#4A4A63;visibility:hidden}
.road.on{visibility:visible}
.roadcar{position:absolute;left:0;top:-20px;width:68px;transition:left .7s ease}
.roadcar svg{width:100%;height:auto;display:block}
.flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1}
@media (max-width:620px){
  .top{flex-wrap:wrap;row-gap:4px}
  .progress{order:5;flex:1 0 100%}
  #langBtn{margin-left:auto}
}
.visual:empty{display:none}
.opts{margin:auto 0}

main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}

/* ---------- Home ---------- */
.home{display:flex;flex-direction:column;gap:14px;padding:6px 2px 10px}
.logo{margin:6px 0 0;text-align:center;font-size:clamp(46px,12vmin,88px);font-weight:800;line-height:1;letter-spacing:.01em;text-shadow:0 5px 0 var(--ink)}
.logo span{display:inline-block;animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
.logo .sp{width:.35em}
.sub{margin:0;text-align:center;font-size:clamp(17px,3.6vmin,24px);color:var(--bgtext)}
.sub small{display:block;font-weight:600;opacity:.8;font-size:.82em}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  background:var(--c);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:12px 10px 10px;gap:8px;min-height:clamp(150px,26vmin,210px);
}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.glyph{font-size:clamp(46px,11vmin,78px);line-height:1.05;font-weight:800;color:var(--ink);flex:1;display:flex;align-items:center}
.tlabel{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:3px 6px 4px;text-align:center;line-height:1.1}
.tlabel b{display:block;font-size:clamp(18px,3.8vmin,26px);font-weight:800}
.tlabel i{display:block;font-style:normal;font-weight:600;font-size:clamp(13px,2.6vmin,17px);opacity:.8}
.album{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:10px 14px 12px}
.album h2{margin:0 0 4px;font-size:clamp(17px,3.4vmin,22px);font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.album h2 small{font-weight:600;opacity:.75}
.stk{display:flex;gap:8px;flex-wrap:wrap;font-size:clamp(30px,7vmin,46px);line-height:1.15;min-height:1.2em}
.stk .empty{font-size:clamp(14px,2.8vmin,18px);font-weight:600;opacity:.75;align-self:center}
.vnote{margin:0;text-align:center;font-size:14px;font-weight:600;color:var(--bgtext);opacity:.85}

/* ---------- Round ---------- */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.promptcard{display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:10px 12px 10px 18px;box-shadow:0 6px 0 var(--ink)}
.ptxt{flex:1}
.pvi{font-size:clamp(24px,5.4vmin,40px);font-weight:800;line-height:1.1}
.pen{font-size:clamp(16px,3.3vmin,24px);font-weight:600;opacity:.75;line-height:1.15;margin-top:2px}
.visual{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.bigemoji{font-size:clamp(84px,24vmin,180px);line-height:1}
.word{font-size:clamp(40px,10vmin,76px);font-weight:800;line-height:1}
.word .blank{display:inline-block;min-width:.8em;border-bottom:6px dashed var(--ink);margin-right:2px;color:transparent}
.enw{font-size:clamp(16px,3.2vmin,22px);font-weight:600;opacity:.75;color:var(--bgtext)}
.items{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;max-width:560px}
.item{font-size:clamp(44px,12vmin,84px);line-height:1;position:relative;padding:2px 4px;border-radius:18px;transition:transform .15s}
.item:active{transform:scale(1.15)}
.item.counted{transform:scale(.88)}
.item.counted::after{
  content:attr(data-n);position:absolute;right:-2px;bottom:-4px;min-width:30px;height:30px;border-radius:50%;
  background:var(--yellow);border:3px solid var(--ink);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;
  animation:pop .3s cubic-bezier(.3,1.8,.5,1);
}
.hint{font-size:clamp(14px,2.8vmin,18px);font-weight:600;color:var(--bgtext);opacity:.8}
.visualcar svg{width:clamp(150px,38vmin,250px);height:auto;display:block;margin:0 auto}
.carphoto{max-width:min(86%,520px);max-height:clamp(150px,34vh,360px);width:auto;height:auto;border:5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);background:var(--paper);object-fit:cover;display:block;margin:0 auto;-webkit-user-drag:none;pointer-events:none}
.opt{overflow:hidden}
.optphoto{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
html{height:100%;height:-webkit-fill-available}
body{height:100vh;height:100dvh}
@media (min-width:760px){
  #app{max-width:1080px;padding-left:max(28px,env(safe-area-inset-left));padding-right:max(28px,env(safe-area-inset-right))}
  .opts{gap:22px}
  .promptcard{padding:14px 18px 14px 26px}
  .top{min-height:72px}
}
@media (orientation:landscape) and (max-height:520px){
  .top{min-height:44px}
  .stage{gap:6px;padding:2px}
  .opt{height:clamp(84px,34vh,140px)}
  .bigemoji{font-size:clamp(56px,20vh,110px)}
  .nextrow{height:60px}
}
@media (hover:none){.opt:hover,.next:hover,.bubble:hover{filter:none}}
.bubble{
  background:var(--paper);border:4px solid var(--ink);border-radius:36px;box-shadow:0 6px 0 var(--ink);
  padding:12px 26px;font-size:clamp(34px,9vmin,64px);font-weight:800;line-height:1.1;
}
.bubble small{display:block;font-size:.42em;font-weight:600;opacity:.75}
.bubble:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{
  height:clamp(104px,27vmin,200px);width:100%;
  background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .2s;line-height:1.05;
}
.opt:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.opt.dim{opacity:.4}
.opt.right{background:var(--green);opacity:1;animation:bounce .7s ease both}
.opt.wrong{animation:shake .45s ease}
.digit{font-size:clamp(46px,13vmin,92px);font-weight:800;line-height:1}
.nm{font-size:clamp(14px,3vmin,20px);font-weight:700}
.nm i{display:block;font-style:normal;font-weight:600;opacity:.7;font-size:.82em}
.swatch{width:68%;height:62%;border-radius:50%;border:4px solid var(--ink)}
.opt svg{width:68%;height:68%;overflow:visible}
.L{font-size:clamp(46px,13vmin,92px);font-weight:800;line-height:1}
.l{font-size:clamp(20px,5vmin,34px);font-weight:700;opacity:.7;line-height:1}
.emo{font-size:clamp(50px,14vmin,100px);line-height:1}

.nextrow{height:76px;display:flex;align-items:center;justify-content:center}
.next{
  background:var(--green);border:5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);
  padding:6px 34px;font-size:clamp(22px,4.6vmin,32px);font-weight:800;line-height:1.05;
}
.next small{display:block;font-weight:600;font-size:.55em;opacity:.8}
.next:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.next[hidden]{display:none}

/* ---------- End ---------- */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:6px}
.sticker{font-size:clamp(110px,32vmin,220px);line-height:1;animation:bounce 1s ease both}
.end h2{margin:0;font-size:clamp(30px,7vmin,52px);font-weight:800;line-height:1.05;color:var(--bgtext)}
.end p{margin:0;font-size:clamp(17px,3.6vmin,24px);color:var(--bgtext);font-weight:600}
.stars{font-size:clamp(32px,8vmin,56px);letter-spacing:.06em}
.endbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.endbtns .next.alt{background:var(--paper)}

.glyph svg{width:clamp(96px,22vmin,160px);height:auto;display:block}
.opt svg.carsvg{width:92%;height:auto}
.stk .sk svg{width:clamp(60px,14vmin,90px);height:auto;display:block}
.sticker svg{width:clamp(230px,62vmin,400px);height:auto}
.end .cname{font-size:clamp(20px,4.4vmin,30px);font-weight:800}

/* ---------- Effects ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:fixed;font-size:28px;line-height:1;animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 280px)) rotate(var(--r)) scale(1);opacity:0}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.14) rotate(-2deg)}55%{transform:scale(.95)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

/* ---------- Original car characters (own design) ---------- */

 bim:{name:'Bim',kind:'race',color:'#8E4DFF',cvi:'tím',cen:'purple',vi:'xe đua',en:'race car',honk:'Bim bim!'},

function loadClip(id,cb){
  if(AUD.buf[id]){cb(AUD.buf[id]);return}
  var ac=ensureAC();if(!ac){cb(null);return}
  try{fetchClip(id).then(function(ab){
    var done=false;function ok(buf){if(done)return;done=true;AUD.buf[id]=buf;cb(buf)}function no(){if(done)return;done=true;cb(null)}
    var pr=ac.decodeAudioData(ab,ok,no);if(pr&&pr.catch)pr.catch(no);
  }).catch(function(){cb(null)})}catch(e){cb(null)}

  var gen=++AUD.gen,ids=items.map(function(it){return clipId(it[0],it[1])}),bufs=[],left=ids.length,failed=false;
  ids.forEach(function(id,i){loadClip(id,function(b){
    if(!b)failed=true;bufs[i]=b;
    if(--left>0)return;
    if(gen!==AUD.gen)return;
    if(failed){speakSynth(items);return}
    var ac=ensureAC(),k=0;
    (function step(){

      var src=ac.createBufferSource();src.buffer=bufs[k++];src.connect(ac.destination);

    })();

function speakSynth(items){

    _utts=[];
    items.forEach(function(it){
      var u=new SpeechSynthesisUtterance(String(it[0]).replace(/[“”"«»]/g,''));
      u.lang=it[1]==='vi'?'vi-VN':'en-US';
      var v=voiceFor(it[1]);if(v){u.voice=v;u.lang=v.lang||u.lang}
      u.rate=it[1]==='vi'?.8:.85;u.pitch=1.1;

      try{speechSynthesis.speak(u)}catch(e){}
    });

  }

}

var AC=null;
function ensureAC(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){}}}

}
function beep(f,t,d,type,v){
  var a=ensureAC();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=f;
  var s=a.currentTime+t;
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(v||.18,s+.02);
  g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.05);
}

    else if(k==='win'){[523,659,784,659,784,1047,1319].forEach(function(f,i){beep(f,i*.11,.3,'triangle')})}

function distinctWith(pool,correct,n,key){
  var out=[correct];var tries=0;
  while(out.length<n&&tries++<200){
    var c=pick(pool);
    if(!out.some(function(o){return key(o)===key(c)}))out.push(c);
  }
  return shuffle(out);
}

    win:{vi:'Đó là '+a.vi+'!',en:'It is '+aEn(a)+'!'}
  };
}
function animalNameRound(){
  var a=pick(ANI_ALL),set=distinctWith(ANI_ALL,a,3,function(x){return x.vi});
  return {
    type:'ani',vi:'Đây là con gì?',en:'What animal is this?',
    visual:'<div class="bigemoji">'+a.e+'</div>',
    opts:set.map(function(x){return {label:x.vi,html:'<span class="nm">'+x.vi+'<i>'+x.en+'</i></span>'}}),
    correct:set.indexOf(a),
    win:{vi:'Đây là '+a.vi+'.',en:'This is '+aEn(a)+'.'}
  };
}
var CAR_RIDDLES=[
 ['Xe nào chạy rất nhanh trên đường đua?','Which car races very fast on the track?','bim'],
 ['Xe nào chở khách đi chơi, đi chợ?','Which car takes passengers around town?','bon'],
 ['Xe nào của chú cảnh sát?','Which car belongs to the police officer?','tit'],
 ['Xe nào đi dập tắt đám cháy?','Which car puts out fires?','pu'],
 ['Xe nào chở đất, cát và đá?','Which car carries soil, sand and rocks?','ro'],
 ['Xe nào không có mái, đón gió mát?','Which car has no roof and enjoys the breeze?','mit']];
function carRiddleRound(){
  var id,vi,en;
  if(rand(3)===0){
    id=pick(CARIDS);var h=CARS[id].honk.replace(/!$/,'');
    vi='Xe nào kêu “'+h+'”?';en='Which car goes “'+h.toLowerCase()+'”?';
  }else{var q=pick(CAR_RIDDLES);id=q[2];vi=q[0];en=q[1]}
  var c=CARS[id],set=distinctWith(CARIDS,id,3,function(x){return x});
  return {
    type:'veh',vi:vi,en:en,
    visual:'<div class="bigemoji">🤔</div><div class="hint">Câu đố · Riddle</div>',
    opts:set.map(function(x){return {label:CARS[x].vi,html:carSVG(x)}}),
    correct:set.indexOf(id),
    win:{vi:'Đây là '+c.vi+' tên '+c.name+'. '+c.honk,en:'This is the '+c.en+'. Honk honk!'}
  };
}
function carWheelsRound(){
  var id=pick(CARIDS),set=[3,4,5];
  return {
    type:'veh',vi:'Xe ô tô có mấy bánh?',en:'How many wheels does a car have?',
    visual:'<div class="visualcar">'+carSVG(id)+'</div>',
    opts:set.map(function(k){return {label:String(k),html:'<span class="digit">'+k+'</span><span class="nm">'+NUM_VI[k]+'<i>'+NUM_EN[k]+'</i></span>'}}),
    correct:1,
    win:{vi:'Xe ô tô có bốn bánh.',en:'A car has four wheels.'}
  };
}
/* ---- Ảnh ô tô thật: thư mục cars/ (danh sách tự tạo trong cars/cars.json) ---- */
var PHOTOS=[];
try{fetch('cars/cars.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():{}}).then(function(m){PHOTOS=(m&&m.cars)||[];PHOTOS.forEach(function(p){try{var im=new Image();im.src='cars/'+encodeURIComponent(p.file)}catch(e){}});preload(PHOTOS.reduce(function(a,p){return a.concat([[p.winvi,'vi'],[p.winen,'en']])},[]))}).catch(function(){})}catch(e){}
function photoImg(p,cls){return '<img class="'+cls+'" src="cars/'+encodeURIComponent(p.file)+'" alt="" draggable="false">'}
var CAR_FILL=[{vi:'xe buýt',en:'bus'},{vi:'xe tải',en:'truck'},{vi:'xe máy',en:'motorbike'},{vi:'xe đạp',en:'bicycle'},{vi:'xe cứu hỏa',en:'fire truck'},{vi:'xe cảnh sát',en:'police car'}];
function carPhotoNameRound(){
  var a=pick(PHOTOS),set=distinctWith(PHOTOS,a,3,function(x){return x.vi}),t=0;
  while(set.length<3&&t++<50){var f=pick(CAR_FILL);if(!set.some(function(x){return x.vi===f.vi}))set.push(f)}
  set=shuffle(set);
  return {
    type:'veh',vi:'Đây là xe gì?',en:'What car is this?',
    visual:'<div class="visualphoto">'+photoImg(a,'carphoto')+'</div>',
    opts:set.map(function(x){return {label:x.vi,html:'<span class="nm">'+x.vi+(x.en?'<i>'+x.en+'</i>':'')+'</span>'}}),
    correct:set.indexOf(a),win:{vi:a.winvi,en:a.winen}
  };
}
function carPhotoPickRound(){
  var a=pick(PHOTOS),set=distinctWith(PHOTOS,a,3,function(x){return x.vi});
  return {
    type:'veh',vi:a.pickvi,en:a.picken,
    visual:'<div class="bigemoji">🔍</div>',
    opts:set.map(function(x){return {label:x.vi,html:photoImg(x,'optphoto')}}),
    correct:set.indexOf(a),win:{vi:a.winvi,en:a.winen}
  };
}
function animalAny(){var f=[animalRound,animalRiddleRound,animalNameRound];return pick(f)()}
function vehicleAny(){var f=[vehicleRound,carRiddleRound,carRiddleRound,carWheelsRound];if(PHOTOS.length>=1)f=f.concat([carPhotoNameRound,carPhotoNameRound,carPhotoNameRound]);if(PHOTOS.length>=3)f=f.concat([carPhotoPickRound,carPhotoPickRound]);return pick(f)()}
var BUILD={num:numberRound,col:colorOrShape,let:letterRound,ani:animalAny,veh:vehicleAny};

/* ---------- Views ---------- */
var view=$('#view');
$('#progress').innerHTML='<div class="road" id="road"><div class="roadcar" id="roadcar"></div><span class="flag">🏁</span></div>';
var roadFor=null;
function setProgress(done,total){
  var road=$('#road'),rc=$('#roadcar');if(!road||!rc)return;
  if(!total){road.classList.remove('on');return}
  road.classList.add('on');
  var id=S.car||'bim';
  if(roadFor!==id){rc.innerHTML=carSVG(id);roadFor=id}
  rc.style.left='calc((100% - 112px) * '+(done/total)+')';
}
function syncControls(){
  $('#soundBtn').textContent=S.sound?'🔊':'🔇';
  $('#langBtn').textContent=S.lang==='both'?'Việt + Anh':'Chỉ Việt';
  $('#homeBtn').hidden=!S.mode;
}
function showHome(){
  clearTimeout(S.timer);stopSpeech();S.mode=null;S.cur=null;
  setProgress(0,0);syncControls();
  var logo='Bé Vui Học'.split('').map(function(c,i){
    return c===' '?'<span class="sp"></span>':'<span style="color:'+LOGO[i%LOGO.length]+';animation-delay:'+(i*60)+'ms">'+c+'</span>';
  }).join('');
  var tiles=TOPICS.map(function(t){
    return '<button class="tile" data-mode="'+t.id+'" style="--c:var('+t.c+')"><span class="glyph">'+(t.glyph==='@car'?carSVG('pu'):t.glyph)+'</span><span class="tlabel"><b>'+t.vi+'</b><i>'+t.en+'</i></span></button>';
  }).join('');
  var stk=S.stickers.length?S.stickers.map(function(s){return '<span class="sk">'+stkHTML(s)+'</span>'}).join(''):'<span class="empty">Chơi xong một trò để nhận nhãn dán nhé! · Finish a game to win a sticker!</span>';
  view.innerHTML='<section class="home">'
    +'<h1 class="logo" aria-label="Bé Vui Học">'+logo+'</h1>'
    +'<p class="sub">Học mà chơi, chơi mà học!<small>Learn while you play!</small></p>'
    +'<div class="tiles">'+tiles+'</div>'
    +'<div class="album"><h2><span>Nhãn dán của bé</span><small>⭐ '+S.stars+' · My stickers</small></h2><div class="stk">'+stk+'</div></div>'
    +'<p class="vnote" id="voiceNote" hidden>Nếu máy không đọc được tiếng Việt, ba mẹ hãy cài giọng đọc tiếng Việt trong phần cài đặt của thiết bị.</p>'
    +'</section>';
  checkNote();
}
function startGame(mode){
  S.mode=mode;S.round=0;S.total=mode==='mix'?8:5;S.lastType=null;S.car=pick(CARIDS);
  ensureAC();goNext();
}
function goNext(){
  clearTimeout(S.timer);
  if(S.round>=S.total){showEnd();return}
  var type=S.mode;
  if(S.mode==='mix'){
    var types=['num','col','let','ani','veh'].filter(function(t){return t!==S.lastType});
    type=pick(types);
  }
  S.lastType=type;
  renderRound(BUILD[type]());
}
function sayPrompt(r){return [[r.vi,'vi'],[r.en,'en']].concat(r.snd&&false?r.snd:[])}
function renderRound(r){
  S.cur=r;S.locked=false;S.count=0;
  setProgress(S.round,S.total);syncControls();
  var showEn=S.lang==='both';
  view.innerHTML='<section class="stage">'
    +'<div class="promptcard"><div class="ptxt"><div class="pvi">'+r.vi+'</div>'+(showEn?'<div class="pen">'+r.en+'</div>':'')+'</div>'
    +'<button class="icon big" id="replay" aria-label="Nghe lại">🔊</button></div>'
    +'<div class="visual">'+(r.visual||'')+'</div>'
    +'<div class="opts">'+r.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" aria-label="'+o.label+'">'+o.html+'</button>'}).join('')+'</div>'
    +'<div class="nextrow"><button class="next" id="next" hidden>Tiếp tục ▶<small>Next</small></button></div>'
    +'</section>';
  setTimeout(function(){speakNow(sayPrompt(r))},250);
  /* tải trước giọng đọc phần trả lời để lúc bấm đáp án đọc ngay, không bị đổi sang giọng của máy */
  preload([[r.win.vi,'vi'],[r.win.en,'en'],['Ồ, thử lại nhé!','vi'],['Oops, try again!','en']].concat(PRAISE.map(function(p){return [p[0],'vi']}),PRAISE.map(function(p){return [p[1],'en']})));
}
function answer(i,el){
  var r=S.cur;
  if(i===r.correct){
    S.locked=true;sfx('ok');
    el.classList.add('right');
    document.querySelectorAll('.opt').forEach(function(o){if(o!==el)o.classList.add('dim')});
    var b=el.getBoundingClientRect();confetti(b.left+b.width/2,b.top+b.height/2,false);
    var p=pick(PRAISE);
    speakNow([[p[0],'vi'],[r.win.vi,'vi'],[p[1],'en'],[r.win.en,'en']]);
    S.round++;setProgress(S.round,S.total);
    var nb=$('#next');if(nb)nb.hidden=false;
    S.timer=setTimeout(goNext,5500);
  }else{
    sfx('no');
    el.classList.add('wrong','dim');el.disabled=true;
    setTimeout(function(){el.classList.remove('wrong')},500);
    speakNow([['Ồ, thử lại nhé!','vi'],['Oops, try again!','en']]);
  }
}
function showEnd(){
  clearTimeout(S.timer);S.cur=null;
  S.stars+=S.total;
  var unowned=function(x){return S.stickers.indexOf(x)<0};
  var freshCars=STICKERS.filter(function(x){return x.indexOf('car:')===0&&unowned(x)});
  var fresh=STICKERS.filter(unowned);
  var st=freshCars.length?pick(freshCars):(fresh.length?pick(fresh):pick(STICKERS));
  if(unowned(st))S.stickers.push(st);
  save();
  var stars='';for(var i=0;i<S.total;i++)stars+='⭐';
  setProgress(S.total,S.total);syncControls();
  var both=S.lang==='both',car=st.indexOf('car:')===0?CARS[st.slice(4)]:null;
  var gotVi=car?'Bé nhận được chú xe '+car.name+'!':'Bé nhận được nhãn dán mới!';
  var gotEn=car?'You got '+car.name+' the '+car.en+'!':'You won a new sticker!';
  view.innerHTML='<section class="end">'
    +'<div class="sticker" aria-hidden="true">'+stkHTML(st)+'</div>'
    +'<h2>Hoan hô! Bé giỏi quá!</h2>'
    +(both?'<p>Hooray! You did it!</p>':'')
    +'<div class="stars" aria-label="'+S.total+' sao">'+stars+'</div>'
    +'<p class="cname">'+gotVi+(both?' · '+gotEn:'')+'</p>'
    +'<div class="endbtns"><button class="next" data-act="again">Chơi tiếp ▶<small>Play again</small></button>'
    +'<button class="next alt" data-act="home">🏠 Về nhà<small>Home</small></button></div>'
    +'</section>';
  sfx('win');
  var w=window.innerWidth,h=window.innerHeight;
  confetti(w*.3,h*.35,true);confetti(w*.7,h*.35,true);
  speakNow([['Hoan hô! Bé giỏi quá!','vi'],[gotVi,'vi']].concat(car?[[car.honk,'vi']]:[],[['Hooray! You did it!','en'],[gotEn,'en']]));
}

/* ---------- Events ---------- */
view.addEventListener('click',function(e){
  var t=e.target;
  var m=t.closest('[data-mode]');if(m){startGame(m.getAttribute('data-mode'));return}
  var act=t.closest('[data-act]');
  if(act){if(act.getAttribute('data-act')==='again'){startGame(S.mode)}else{showHome()}return}
  var opt=t.closest('.opt');
  if(opt&&S.cur&&!S.locked){answer(+opt.getAttribute('data-i'),opt);return}
  if(t.closest('#replay')&&S.cur){speakNow(sayPrompt(S.cur));return}
  if(t.closest('#bubble')&&S.cur){sfx('pop');speakNow(S.cur.snd);return}
  if(t.closest('#next')){goNext();return}
  var it=t.closest('.item');
  if(it&&S.cur&&S.cur.type==='num'&&!it.classList.contains('counted')){
    S.count++;it.setAttribute('data-n',S.count);it.classList.add('counted');
    sfx('pop');speakNow([[NUM_VI[S.count],'vi'],[NUM_EN[S.count],'en']]);
  }
});
$('#homeBtn').addEventListener('click',showHome);
$('#soundBtn').addEventListener('click',function(){
  S.sound=!S.sound;if(!S.sound)stopSpeech();save();syncControls();
});
$('#langBtn').addEventListener('click',function(){
  S.lang=S.lang==='both'?'vi':'both';save();syncControls();
  if(S.cur){renderRound(S.cur)}else if(!S.mode&&view.querySelector('.home')){showHome()}
});
document.addEventListener('pointerdown',function(){ensureAC()},{once:true});
['touchend','click'].forEach(function(ev){document.addEventListener(ev,function(){unlockSpeech();ensureAC()},{once:true,capture:true})});
document.addEventListener('visibilitychange',function(){if(document.hidden)stopSpeech();else ensureAC()});
window.addEventListener('pagehide',stopSpeech);

showHome();
})();
</script>
</body>
</html>
