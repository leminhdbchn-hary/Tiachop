<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bé Vui Học">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8FD3F8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Bé Vui Học - game học tập song ngữ Việt - Anh cho bé 3-5 tuổi">
<title>Bé Vui Học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#25234A; --sky:#8ED6FA; --sky2:#E6F6FF; --paper:#FFFFFF;
  --line:#BCD0F0; --lineD:#9DB8E6; --soft:rgba(40,70,140,.14);
  --yellow:#FFC93C; --green:#4CD07D; --blue:#6BB8FF;
  --bgtext:#25234A;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  box-sizing:border-box;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#2B2766; --sky2:#4A44A8; --bgtext:#FFFFFF; --line:#8E9FD8; --lineD:#6C7DC0; }
}
:root[data-theme="dark"]{ --sky:#2B2766; --sky2:#4A44A8; --bgtext:#FFFFFF; --line:#8E9FD8; --lineD:#6C7DC0; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:var(--sat);height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;height:100%;
  font-family:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;
  font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overflow:hidden;
}
@supports (height:100dvh){html,body{height:100dvh}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:5px solid var(--yellow);outline-offset:3px}

#city{position:fixed;left:0;right:0;bottom:0;height:36vh;max-height:340px;pointer-events:none;z-index:0}
#city svg{width:100%;height:100%;display:block}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:980px;margin:0 auto;padding:max(10px,calc(var(--sat) * .25)) 14px max(14px,calc(var(--sab) * .35))}
.top #langBtn{margin-left:auto}
.top{display:flex;align-items:center;gap:10px;min-height:60px;margin-top:clamp(14px,3vh,30px)}
.icon{
  min-width:56px;height:56px;border-radius:18px;background:linear-gradient(180deg,#fff,#EEF5FF);
  border:3px solid var(--lineD);box-shadow:0 4px 0 var(--lineD),0 8px 14px var(--soft);
  font-size:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;
}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lineD)}
.icon.pill{font-size:16px;font-weight:800}
.icon.big{min-width:64px;height:64px;font-size:30px;background:linear-gradient(180deg,#FFE27A,#FFC93C);border-color:#E0A21B;box-shadow:0 4px 0 #E0A21B,0 8px 14px var(--soft);flex:none}
.icon[hidden]{display:none}
.progress{flex:1;min-width:0;padding-top:18px}
.road{position:relative;height:36px;border:3px solid #fff;border-radius:16px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 26px) 0 50%/100% 4px no-repeat,linear-gradient(180deg,#6A6F8E,#4A4F6C);box-shadow:0 4px 10px var(--soft);visibility:hidden}
.road.on{visibility:visible}
.roadcar{position:absolute;left:0;top:-28px;width:66px;transition:left .7s ease;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.roadcar svg{width:100%;height:auto;display:block}
.flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:22px;line-height:1}
@media (max-width:620px){
  .top{flex-wrap:wrap;row-gap:4px}
  .progress{order:5;flex:1 0 100%}
  #langBtn{margin-left:auto}
}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}

/* ---------- Home ---------- */
.home{display:flex;flex-direction:column;gap:14px;padding:14px 2px 24px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:end;gap:6px}
.sign{
  position:relative;text-align:center;padding:12px 10px 12px;border-radius:24px;
  background:linear-gradient(180deg,#F4CC8A 0%,#E2A55A 100%);border:5px solid #B27431;
  box-shadow:0 7px 0 #8A5521,0 14px 22px var(--soft);
}
.sign::before,.sign::after{content:"";position:absolute;top:9px;width:9px;height:9px;border-radius:50%;background:#8A5521;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.sign::before{left:10px}.sign::after{right:10px}
.st1{font-size:clamp(26px,6.4vmin,46px);font-weight:800;line-height:1;color:#1F4FA8;text-shadow:0 2px 0 #fff,0 0 8px rgba(255,255,255,.8)}
.st2{font-size:clamp(46px,12vmin,86px);font-weight:800;line-height:.9;color:#E8332A;text-shadow:0 3px 0 #fff,0 5px 0 #A51D16;letter-spacing:.02em}
.sign-p{display:inline-block;margin-top:8px;background:#FFE27A;border:3px solid #E0A800;border-radius:999px;padding:1px 12px;font-size:clamp(12px,2.8vmin,17px);font-weight:800;line-height:1.35}
.mascot{position:relative;padding-top:50px}
.mascot svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.bubble2{
  position:absolute;left:-6px;right:0;top:0;background:#fff;border:3px solid var(--line);border-radius:20px;padding:4px 10px;
  text-align:center;font-size:clamp(13px,2.9vmin,18px);font-weight:800;line-height:1.1;box-shadow:0 4px 10px var(--soft)
}
.bubble2 small{display:block;font-weight:600;opacity:.7;font-size:.82em}
.bubble2::after{content:"";position:absolute;left:62%;bottom:-11px;width:16px;height:16px;background:#fff;border-right:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg) skew(10deg,10deg)}
.bubble2.mission{font-family:inherit;color:var(--ink);cursor:pointer}
.bubble2.mission:active{transform:translateY(3px)}
.bubble2.mission.done{background:#E6F9E8;border-color:#2FBF5B}
.mdone{margin:0;background:#FFE88F;border:3px solid #E0A21B;border-radius:16px;padding:4px 14px;font-weight:800;font-size:clamp(14px,3vmin,20px)}
.chopline svg{width:clamp(90px,22vmin,150px);height:auto;display:block;margin:0 auto}
.levels{display:flex;gap:10px;justify-content:center}
.lv{
  flex:1;max-width:210px;background:linear-gradient(180deg,#fff,#EEF5FF);border:3px solid var(--lineD);border-radius:22px;box-shadow:0 5px 0 var(--lineD),0 10px 16px var(--soft);
  padding:6px 8px;display:flex;align-items:center;gap:8px;justify-content:center;line-height:1;min-height:62px;
}
.lv .n{font-size:clamp(32px,7.4vmin,46px);font-weight:800}
.lv .t{font-size:clamp(12px,2.6vmin,16px);font-weight:700;text-align:left;line-height:1.1}
.lv .t i{display:block;font-style:normal;font-weight:600;opacity:.75}
.lv.on{background:linear-gradient(180deg,#FFE88F,#FFC93C);border-color:#E0A21B;box-shadow:0 2px 0 #E0A21B,0 8px 14px var(--soft);transform:translateY(3px)}
.albumbar{
  display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#fff,#F4F0FF);border:3px solid #C3B2F5;border-radius:26px;box-shadow:0 5px 0 #C3B2F5,0 10px 16px var(--soft);
  padding:8px 16px;text-align:left;
}
.albumbar:active{transform:translateY(4px);box-shadow:0 1px 0 #C3B2F5}
.albumbar .ab-i{font-size:clamp(34px,8vmin,50px);line-height:1}
.albumbar .ab-t{flex:1;font-size:clamp(19px,4.2vmin,28px);font-weight:800;line-height:1.05}
.albumbar .ab-t i{display:block;font-style:normal;font-weight:600;font-size:.62em;opacity:.75}
.albumbar .ab-n{font-size:clamp(20px,4.4vmin,30px);font-weight:800;background:linear-gradient(180deg,#FFE88F,#FFC93C);border:3px solid #E0A21B;border-radius:16px;padding:2px 12px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  position:relative;background:var(--c);border:4px solid var(--cd);border-radius:28px;box-shadow:0 7px 0 var(--cd),0 14px 20px var(--soft);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:12px 10px 10px;gap:8px;min-height:clamp(140px,24vmin,200px);overflow:hidden;
}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.tile:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.glyph{position:relative;font-size:clamp(44px,10vmin,74px);line-height:1.05;font-weight:800;color:var(--ink);flex:1;display:flex;align-items:center}
.glyph svg{width:clamp(100px,22vmin,160px);height:auto;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
.badge3d{position:absolute;left:-10px;top:-14px;z-index:2;background:#fff;border:3px solid var(--cd);border-radius:12px;padding:0 8px;font-size:18px;font-weight:800;line-height:1.3;color:var(--ink)}
.tlabel{position:relative;width:100%;background:#fff;border:3px solid var(--cd);border-radius:16px;padding:3px 6px 4px;text-align:center;line-height:1.1}
.tlabel b{display:block;font-size:clamp(17px,3.6vmin,25px);font-weight:800}
.tlabel i{display:block;font-style:normal;font-weight:600;font-size:clamp(12px,2.5vmin,16px);opacity:.8}
.vnote{margin:0;text-align:center;font-size:14px;font-weight:600;color:var(--bgtext);opacity:.85}

/* ---------- Round ---------- */
.stage{--ac:#2F7BFF;--acb:#E4F1FF;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.promptcard{display:flex;align-items:center;gap:12px;background:var(--acb);border:3px solid var(--ac);border-radius:26px;padding:10px 12px 10px 12px;box-shadow:0 5px 0 var(--ac),0 12px 20px var(--soft);position:relative}
.qn{flex:none;width:50px;height:50px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),0 3px 6px var(--soft);line-height:1}
.ptxt{flex:1}
.pvi{font-size:clamp(22px,5vmin,36px);font-weight:800;line-height:1.1}
.pen{font-size:clamp(15px,3.1vmin,22px);font-weight:600;opacity:.72;line-height:1.15;margin-top:2px}
.visual{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.visual:empty{display:none}
.bigemoji{font-size:clamp(130px,38vmin,270px);line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.15))}
.word{font-size:clamp(40px,10vmin,76px);font-weight:800;line-height:1}
.word .blank{display:inline-block;min-width:.8em;border-bottom:6px dashed var(--ink);margin-right:2px;color:transparent}
.enw{font-size:clamp(16px,3.2vmin,22px);font-weight:600;opacity:.75;color:var(--bgtext)}
.bigletter{font-size:clamp(110px,30vmin,220px);font-weight:800;line-height:1;text-shadow:0 6px 0 var(--ink);color:var(--paper)}
.items{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;max-width:600px}
.item{font-size:clamp(44px,12vmin,84px);line-height:1;position:relative;padding:2px 4px;border-radius:18px;transition:transform .15s}
.item svg{width:clamp(70px,17vmin,110px);height:auto;display:block}
.item:active{transform:scale(1.15)}
.item.counted{transform:scale(.88)}
.item.counted::after{
  content:attr(data-n);position:absolute;right:-2px;bottom:-4px;min-width:30px;height:30px;border-radius:50%;
  background:linear-gradient(180deg,#FFE88F,#FFC93C);border:3px solid #E0A21B;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;
  animation:pop .3s cubic-bezier(.3,1.8,.5,1);
}
.item.pick{background:rgba(255,255,255,.35);border:3px dashed transparent}
.item.pick.sel{background:#fff;border:3px solid var(--ac);box-shadow:0 4px 0 var(--ac);transform:translateY(-4px)}
.hint{font-size:clamp(14px,2.8vmin,18px);font-weight:600;color:var(--bgtext);opacity:.8}
.bubble{
  background:#fff;border:3px solid var(--ac);border-radius:36px;box-shadow:0 5px 0 var(--ac),0 12px 20px var(--soft);
  padding:12px 26px;font-size:clamp(34px,9vmin,64px);font-weight:800;line-height:1.1;
}
.bubble small{display:block;font-size:.42em;font-weight:600;opacity:.75}
.bubble:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ac)}
.target svg{width:clamp(190px,50vmin,330px);height:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.shadow svg,.shadow .bigemoji{filter:brightness(0) opacity(.85)}
.paintcar svg{width:clamp(200px,54vmin,340px);height:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.seq{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.seq .num{min-width:clamp(56px,13vmin,88px);height:clamp(56px,13vmin,88px);padding:0 10px;background:#fff;border:3px solid var(--ac);border-radius:20px;font-size:clamp(34px,8vmin,56px);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ac)}
.dotc{width:clamp(38px,9.5vmin,62px);height:clamp(38px,9.5vmin,62px);border-radius:50%;border:3px solid rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;font-size:clamp(22px,5vmin,34px);font-weight:800;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),inset 0 4px 0 rgba(255,255,255,.4)}
.q{background:#fff;border-style:dashed}
.tl svg{height:clamp(130px,30vmin,210px);width:auto}

.opts{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:14px;margin:auto 0;padding-top:6px}
.card{position:relative}
.opt{
  position:relative;height:clamp(140px,38vmin,280px);width:100%;
  background:linear-gradient(180deg,#FFFFFF,#EAF3FF);border:3px solid var(--line);border-radius:26px;
  box-shadow:0 6px 0 var(--line),0 12px 20px var(--soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .2s;line-height:1.05;overflow:hidden;
}
.opts.n2 .opt{height:clamp(160px,44vmin,300px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.opt.dim{opacity:.4}
.opt.right{background:linear-gradient(180deg,#F0FFF4,#BDEFCB);border-color:#2FBF5B;box-shadow:0 6px 0 #2FBF5B,0 0 0 5px rgba(47,191,91,.25);opacity:1;animation:bounce .7s ease both}
.opt.right::after{content:"✔";position:absolute;left:10px;top:4px;font-size:28px;color:#1F9A47;line-height:1}
.opt.wrong{border-color:#FF6B6B;animation:shake .45s ease}
.spk{
  position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(180deg,#FFE88F,#FFC93C);border:3px solid #E0A21B;box-shadow:0 3px 0 #E0A21B;
  font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2;line-height:1;
}
@media (max-width:480px){.spk{width:40px;height:40px;font-size:18px;right:5px;top:5px}}
.spk:active{transform:translateY(3px);box-shadow:0 0 0 #E0A21B}
.digit{font-size:clamp(46px,13vmin,92px);font-weight:800;line-height:1}
.nm{font-size:clamp(14px,3vmin,20px);font-weight:700}
.nm i{display:block;font-style:normal;font-weight:600;opacity:.7;font-size:.82em}
.swatch{height:60%;aspect-ratio:1;width:auto;max-width:80%;border-radius:50%;border:3px solid rgba(0,0,0,.3);display:block;box-shadow:inset 0 -8px 0 rgba(0,0,0,.14),inset 0 8px 0 rgba(255,255,255,.35)}
.opt svg{width:68%;height:68%;overflow:visible}
.opt svg.carsvg{width:92%;height:auto;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.opt .sz{display:block}
.opt .sz svg.carsvg{width:100%}
.L{font-size:clamp(46px,13vmin,92px);font-weight:800;line-height:1}
.l{font-size:clamp(20px,5vmin,34px);font-weight:700;opacity:.7;line-height:1}
.emo{font-size:clamp(62px,18vmin,150px);line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.15))}
.grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:clamp(20px,5.2vmin,34px);line-height:1.1;padding:4px 8px;max-width:100%}
.seq .grp{font-size:clamp(34px,9vmin,58px);max-width:40vw}
.hbar{display:block;height:26%;border-radius:999px;border:3px solid rgba(0,0,0,.3);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.35)}
.vwrap{height:78%;display:flex;align-items:flex-end}
.vbar{display:block;width:clamp(30px,8vmin,54px);border-radius:14px 14px 4px 4px;border:3px solid rgba(0,0,0,.3);box-shadow:inset -6px 0 0 rgba(0,0,0,.12),inset 6px 0 0 rgba(255,255,255,.3)}

.nextrow{height:76px;display:flex;align-items:center;justify-content:center;flex:none;margin-bottom:clamp(48px,11vh,130px)}
.next{
  background:linear-gradient(180deg,#8CEBA8,#2FBF5B);border:3px solid #1F8F44;border-radius:26px;box-shadow:0 6px 0 #1F8F44,0 12px 18px var(--soft);
  padding:6px 34px;font-size:clamp(22px,4.6vmin,32px);font-weight:800;line-height:1.05;color:#103A20;
}
.next small{display:block;font-weight:600;font-size:.55em;opacity:.8}
.next:active{transform:translateY(5px);box-shadow:0 1px 0 #1F8F44}
.next[hidden]{display:none}

/* ---------- End ---------- */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:6px 6px 16px}
.sticker{font-size:clamp(110px,32vmin,220px);line-height:1;animation:bounce 1s ease both}
.sticker svg{width:clamp(230px,62vmin,400px);height:auto;filter:drop-shadow(0 10px 6px rgba(0,0,0,.2))}
.end h2{margin:0;font-size:clamp(30px,7vmin,52px);font-weight:800;line-height:1.05;color:var(--bgtext)}
.end p{margin:0;font-size:clamp(17px,3.6vmin,24px);color:var(--bgtext);font-weight:600}
.end .cname{font-size:clamp(20px,4.4vmin,30px);font-weight:800}
.stars{font-size:clamp(32px,8vmin,56px);letter-spacing:.06em}
.endbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.endbtns .next.alt{background:linear-gradient(180deg,#fff,#EAF3FF);border-color:var(--lineD);box-shadow:0 6px 0 var(--lineD),0 12px 18px var(--soft)}
.endbtns .next.blue{background:linear-gradient(180deg,#B5DDFF,#5AA9F2);border-color:#2F7BC4;box-shadow:0 6px 0 #2F7BC4,0 12px 18px var(--soft)}

/* ---------- Album ---------- */
.albumv{display:flex;flex-direction:column;gap:10px;padding:6px 2px 18px}
.atitle{margin:0;font-size:clamp(26px,6vmin,42px);font-weight:800;line-height:1.05;color:var(--bgtext);display:flex;flex-direction:column}
.atitle small{font-size:.5em;font-weight:600;opacity:.8}
.ahint{margin:0;font-size:clamp(14px,2.8vmin,18px);font-weight:600;color:var(--bgtext);opacity:.85}
.asec{margin:16px 2px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;color:var(--bgtext);font-size:clamp(20px,4.4vmin,28px);font-weight:800;line-height:1.1}
.asec i{font-size:.6em;font-weight:600;opacity:.8}
.asec b{margin-left:auto;font-size:.6em;background:rgba(255,255,255,.75);color:#25234A;padding:2px 10px;border-radius:12px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.acell{

/* ---- colour helpers ---- */
function shade(hex,p){
  var h=hex.replace('#',''),t=p<0?0:255,k=Math.abs(p),out='#';
  for(var i=0;i<3;i++){
    var v=parseInt(h.substr(i*2,2),16),x=Math.round((t-v)*k+v);
    out+=(x<16?'0':'')+x.toString(16);
  }
  return out;
}

var AUD={idx:{},buf:{},gen:0,src:null};

    var done=false;function ok(buf){if(done)return;done=true;AUD.buf[id]=buf;cb(buf)}function no(){if(done)return;done=true;cb(null)}

function runSeq(items,gen){
  var k=0;
  items.forEach(function(it){var id=clipId(it[0],it[1]);if(AUD.idx[id])loadClip(id,function(){})});
  (function step(){
    if(gen!==AUD.gen||k>=items.length)return;
    var it=items[k++],id=clipId(it[0],it[1]);
    if(AUD.idx[id]){
      loadClip(id,function(b){
        if(gen!==AUD.gen)return;
        if(!b){synthOne(it,step,gen);return}
        var ac=ensureAC();
        whenRun(ac,function(){
          if(gen!==AUD.gen)return;
          var src=ac.createBufferSource();src.buffer=b;src.connect(ac.destination);
          src.onended=function(){if(AUD.src===src)AUD.src=null;setTimeout(step,120)};
          AUD.src=src;try{src.start(0)}catch(e){synthOne(it,step,gen)}
        });
      });
    }else synthOne(it,step,gen);
  })();
}

var AC=null;
function ensureAC(){
  if(AC&&AC.state==='closed')AC=null;
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){}}}
  if(AC&&AC.state!=='running'){try{var p=AC.resume();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  return AC;
}
/* iPhone: công tắc im lặng sẽ tắt tiếng WebAudio. Phát một đoạn <audio> im lặng để iOS coi đây là "phát nhạc" và vẫn kêu */
var _sil=null;
function mediaUnlock(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{
    if(!_sil){
      var n=2400,b=new Uint8Array(44+n),dv=new DataView(b.buffer),w=function(o,t){for(var i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
      w(0,'RIFF');dv.setUint32(4,36+n,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
      dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,'data');dv.setUint32(40,n,true);
      for(var i=0;i<n;i++)b[44+i]=128;
      _sil=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));_sil.setAttribute('playsinline','');_sil.preload='auto';
    }
    _sil.currentTime=0;var pr=_sil.play();if(pr&&pr.catch)pr.catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){try{ensureAC()}catch(e){}}});
function beep(f,t,d,type,v){
  var a=ensureAC();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=f;
  var s=a.currentTime+t;
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(v||.18,s+.02);
  g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.05);
}
function sfx(k){
  if(!S.sound)return;
  try{
    if(k==='ok'){[523,659,784,1047].forEach(function(f,i){beep(f,i*.09,.25,'triangle')})}
    else if(k==='no'){beep(250,0,.18,'sine',.15);beep(200,.14,.22,'sine',.15)}
    else if(k==='win'){[523,659,784,659,784,1047,1319].forEach(function(f,i){beep(f,i*.11,.3,'triangle')})}
    else if(k==='pop'){beep(700,0,.08,'sine',.12)}
    else if(k==='honk'){beep(392,0,.16,'square',.1);beep(494,.14,.28,'square',.1)}
    else if(k==='star'){beep(880,0,.12,'triangle',.15);beep(1320,.08,.2,'triangle',.15)}
  }catch(e){}
}
function confetti(x,y,many){
  var fx=$('#fx');var n=reduce?5:(many?40:26);
  var em=['⭐','✨','🎉','💛','🌟','🎈'];
  for(var i=0;i<n;i++){

function distinctWith(pool,correct,n,key){
  var out=[correct],tries=0;
  while(out.length<n&&tries++<300){
    var c=pick(pool);
    if(!out.some(function(o){return key(o)===key(c)}))out.push(c);
  }
  return shuffle(out);
}

var CMPW={
 siz:{big:['to','big','bigger','biggest'],small:['nhỏ','small','smaller','smallest']},
 len:{big:['dài','long','longer','longest'],small:['ngắn','short','shorter','shortest']},

  var wantBig=rand(2)===0,max=Math.max.apply(null,sizes),min=Math.min.apply(null,sizes);
  var target=wantBig?max:min,order=shuffle(sizes),w=CMPW[kind][wantBig?'big':'small'];
  var col=pick(COLORS.slice(0,7)).hex,id=pick(CARIDS);

  var opts=order.map(function(p){
    var html;
    if(kind==='siz')html='<span class="sz" style="width:'+p+'%">'+carSVG(id)+'</span>';

  });

    vi:noun+' '+w[0]+(three?' nhất':' hơn')+'?',en:enNoun+(three?'the '+w[3]:w[2])+'?',visual:'',

    trees.forEach(function(t){t.position.z=((pd+t.userData.o)%150)-135});
    clouds.forEach(function(c){c.position.x+=c.userData.v*dt;if(c.position.x>50)c.position.x=-50});
    birds.forEach(function(b){
      var u=b.userData;b.position.x+=u.dir*u.v*dt;if(b.position.x>34)b.position.x=-34;if(b.position.x<-34)b.position.x=34;
      b.position.z=((u.zo+pd*.5)%75)-82;b.position.y=u.y+Math.sin(st.t*1.6+u.bob)*.5;
      var fl=Math.sin(st.t*11+u.ph)*.7;u.wings.forEach(function(w){w[0].rotation.x=w[1]*fl});
    });
    fin.position.z=pd-L;
    /* items */
    for(var j=0;j<course.length;j++){
      var o=course[j],rz=pd-o.d;
      if(o.type==='star'){o.m.visible=!o.hit&&rz<9;o.m.position.z=rz;o.m.rotation.y+=dt*3;
        if(!o.hit&&racing&&Math.abs(rz)<1.3&&Math.abs(LANES[o.lane]-st.carX)<1.15){
          o.hit=true;o.m.visible=false;st.count++;st.boost=.9;var sn=$('#starN');if(sn){sn.textContent=st.count;sn.parentNode.classList.remove('on');void sn.parentNode.offsetWidth;sn.parentNode.classList.add('on')}
          sfx('star');car.scale.setScalar(.95);
        }
      }else{
        if(o.hit){o.fly=(o.fly||0)+dt;o.m.position.y=Math.sin(Math.min(o.fly,.7)/.7*Math.PI)*2.2;o.m.rotation.x+=dt*9;o.m.rotation.z+=dt*7;o.m.visible=o.fly<.8}
        o.m.position.z=rz;if(!o.hit)o.m.visible=rz<9;
        if(!o.hit&&racing&&Math.abs(rz)<.95&&Math.abs(LANES[o.lane]-st.carX)<1.0){o.hit=true;st.slow=.9;st.blink=.8;st.hits++;sfx('no')}
      }
    }
    /* car */
    var tx=LANES[st.lane];st.carX+=(tx-st.carX)*Math.min(1,dt*10);
    car.position.x=st.carX;car.position.y=Math.abs(Math.sin(st.t*12))*.04*(st.speed>.5?1:0);
    car.rotation.z=(tx-st.carX)*.07;
    car.visible=st.blink>0?Math.floor(st.t*14)%2===0:true;
    var sc=car.scale.x;if(sc>.8)car.scale.setScalar(Math.max(.8,sc-dt*.5));
    car.userData.wheels.forEach(function(w){w.rotation.x-=st.speed*dt*1.6});
    rival.position.set(rv.x,Math.abs(Math.sin(st.t*12+1))*.04,pd-rv.d);
    rival.rotation.z=(LANES[rv.lane]-rv.x)*.07;
    rival.visible=rival.position.z<cam.position.z-3&&rival.position.z>-110;
    rival.userData.wheels.forEach(function(w){w.rotation.x-=9*dt*1.6});
    setBar();
    if(racing&&st.dist>=L&&!st.fin){st.fin=true;finish()}
    else if(racing&&st.rt>28&&!st.fin){st.fin=true;st.rv.fin=true;finish()}
    renderer.render(scene,cam);
    st.raf=requestAnimationFrame(frame);
  }
  st.raf=requestAnimationFrame(frame);
  setTimeout(driveSay,300);
}

function openShowroom(id){
  stop3D();clearTimeout(S.timer);stopSpeech();
  S.mode='show';S.cur=null;setProgress(0,0);syncControls();
  var c=CARS[id];
  var sw=COLORS.slice(0,7).map(function(x){
    return '<button class="sw" data-hex="'+x.hex+'" data-vi="'+x.vi+'" data-en="'+x.en+'" style="background:'+x.hex+'" aria-label="'+x.vi+'"></button>';
  }).join('');

    +'<div class="sname"><div class="nmt"><b class="nmn">'+c.name+'</b> · '+c.vi+'<small>'+c.en+'</small></div>'
    +'<button class="icon" data-act="album" aria-label="Album">📒</button></div>'
    +'<div id="gl"></div><div class="palette">'+sw+'</div>'
    +'<div class="hint" style="text-align:center;background:rgba(255,255,255,.88);border-radius:14px;padding:2px 10px;opacity:1">Chạm xe để bấm còi · Vuốt để xoay · Tap to honk, swipe to spin</div></section>';
  if(!window.THREE){noGL();return}
  try{
    var T=THREE,el=$('#gl'),renderer=mkRenderer(el);
    var scene=new T.Scene();scene.background=new T.Color(0xbfe6ff);
    var cam=new T.PerspectiveCamera(45,1,.1,100);
    function fit(){
      var w=Math.max(el.clientWidth,50),h=Math.max(el.clientHeight,50),asp=w/h;
      renderer.setSize(w,h);cam.aspect=asp;
      var dist=Math.max(9.5,Math.min(22,4.6/(Math.tan(22.5*Math.PI/180)*asp)));
      cam.position.set(0,dist*.32,dist);cam.lookAt(0,1.05,0);cam.updateProjectionMatrix();
    }
    scene.add(new T.AmbientLight(0xffffff,.5));scene.add(new T.HemisphereLight(0xffffff,0x9db4d8,.45));
    var dl=new T.DirectionalLight(0xffffff,.65);dl.position.set(5,9,7);scene.add(dl);
    var plat=new T.Mesh(new T.CylinderGeometry(3.6,3.6,.25,40),new T.MeshLambertMaterial({color:0xffffff}));plat.position.y=-.12;scene.add(plat);
    var ring=new T.Mesh(new T.CylinderGeometry(3.9,3.9,.2,40),new T.MeshLambertMaterial({color:0x25234a}));ring.position.y=-.22;scene.add(ring);
    var car=make3DCar(id);car.rotation.y=.5;scene.add(car);
    var st={run:true,raf:0,renderer:renderer,onResize:fit,bump:0,drag:false,spin:.7};
    D=st;fit();window.addEventListener('resize',fit);
    var gl=$('#gl'),lx=0,moved=0;
    gl.addEventListener('pointerdown',function(e){st.drag=true;lx=e.clientX;moved=0;try{gl.setPointerCapture(e.pointerId)}catch(_){}});
    gl.addEventListener('pointermove',function(e){if(!st.drag)return;var dx=e.clientX-lx;lx=e.clientX;moved+=Math.abs(dx);car.rotation.y+=dx*.012});
    gl.addEventListener('pointerup',function(){
      st.drag=false;
      if(moved<8){sfx('honk');st.bump=.22;speakNow([[c.honk,'vi',true]])}
    });
    var last=performance.now();
    function frame(now){
      if(D!==st||!st.run)return;
      var dt=Math.min(.05,(now-last)/1000);last=now;
      if(!st.drag)car.rotation.y+=dt*st.spin*(reduce?0:1);
      if(st.bump>0){st.bump=Math.max(0,st.bump-dt*.8);car.scale.setScalar(1+Math.sin(st.bump*28)*st.bump*.6)}
      renderer.render(scene,cam);st.raf=requestAnimationFrame(frame);
    }
    st.raf=requestAnimationFrame(frame);
    st.car=car;
    setTimeout(function(){speakNow([['Xin chào bé! Mình là '+c.name+'.','vi'],[c.honk,'vi'],['Hello! I am '+c.name+' the '+c.en+'.','en']])},300);
  }catch(e){noGL()}
}

function totalFor(mode){var base=[0,5,6,8][S.level];return mode==='mix'?base+3:base}
function startGame(mode){
  stop3D();
  if(mode==='drive'){ensureAC();startDrive();return}
  S.mode=mode;S.round=0;S.total=totalFor(mode);S.lastTopic=null;S.used={};S.usedQ={};S.usedA={};S.lastFn=null;S.car=rand(2)?'chop':pick(CARIDS);
  ensureAC();goNext();
}
function buildRound(topic){
  var arr=POOL[(S.lang==='en'&&topic==='let')?'letEn':topic][S.level],r,fn,tries=0,bad;
  S.usedQ=S.usedQ||{};S.usedA=S.usedA||{};
  do{
    fn=pick(arr);tries++;
    if(arr.length>1&&fn===S.lastFn&&tries<25){bad=true;continue}   /* not the same kind of question twice in a row */
    r=fn();
    var ans=r.opts&&r.opts[r.correct]?r.opts[r.correct].label:'';
    bad=!!S.used[r.key]                                              /* exact same question */
      ||(tries<60&&!!S.usedQ[r.vi+'|'+r.en])                         /* same wording */
      ||(tries<40&&ans&&ans!=='lựa chọn'&&!!S.usedA[ans]);           /* same answer again */
  }while(bad&&tries<90);
  S.lastFn=fn;S.used[r.key]=1;S.usedQ[r.vi+'|'+r.en]=1;
  if(r.opts&&r.opts[r.correct]&&r.opts[r.correct].label)S.usedA[r.opts[r.correct].label]=1;
  r.topic=topic;return r;
}
function goNext(){
  clearTimeout(S.timer);
  if(S.round>=S.total){showEnd();return}
  var topic=S.mode;
  if(S.mode==='mix'){
    var ts=TOPIC_IDS.filter(function(t){return t!==S.lastTopic});
    topic=pick(ts);
  }
  S.lastTopic=topic;
  renderRound(buildRound(topic));
}
function sayPrompt(r){var a=[[r.sv||r.vi,'vi'],[r.se!==undefined?r.se:r.en,'en']];return r.pa?a.concat(r.pa):a}
function renderRound(r){
  S.cur=r;S.locked=false;S.count=0;S.sel=0;
  setProgress(S.round,S.total);syncControls();
  var showEn=S.lang==='both',n=r.opts.length;
  var cards=r.opts.map(function(o,i){
    return '<div class="card"><button class="opt" data-i="'+i+'" aria-label="'+o.label+'">'+o.html+'</button>'
      +(o.say?'<button class="spk" data-s="'+i+'" aria-label="Nghe">🔊</button>':'')+'</div>';
  }).join('');
  var pal=PALS[S.round%PALS.length];
  view.innerHTML='<section class="stage" style="--ac:'+pal[0]+';--acb:'+pal[1]+'">'
    +'<div class="promptcard"><div class="qn">'+(S.round+1)+'</div><div class="ptxt"><div class="pvi">'+(S.lang==='en'?(r.en||r.vi):r.vi)+'</div>'+(showEn?'<div class="pen">'+r.en+'</div>':'')+'</div>'
    +'<button class="icon big" id="replay" aria-label="Nghe lại">🔊</button></div>'
    +'<div class="visual">'+(r.visual||'')+'</div>'
    +(n?'<div class="opts n'+n+'" style="--n:'+n+'">'+cards+'</div>':'')
    +'<div class="nextrow"><button class="next" id="next" hidden>Tiếp tục ▶<small>Next</small></button></div>'
    +'</section>';
  setTimeout(function(){if(S.cur===r)speakNow(sayPrompt(r))},250);
  setTimeout(function(){if(S.cur!==r)return;var l=[];r.opts.forEach(function(o){if(o.say)l=l.concat(o.say)});l=l.concat([[r.win.vi,'vi'],[r.win.en,'en']],PRAISE.reduce(function(a,p){return a.concat([[p[0],'vi'],[p[1],'en']])},[]),r.wx||[]);preload(l.filter(function(x){return x[2]===true||(x[1]==='vi'?S.lang!=='en':S.lang!=='vi')}))},700);
}
function succeed(el){
  var r=S.cur;S.locked=true;sfx('ok');
  if(el){
    el.classList.add('right');
    document.querySelectorAll('.opt').forEach(function(o){if(o!==el)o.classList.add('dim')});
    var b=el.getBoundingClientRect();confetti(b.left+b.width/2,b.top+b.height/2,false);
  }else{confetti(window.innerWidth/2,window.innerHeight/2.4,false)}
  if(r.onCorrect)r.onCorrect();
  var p=pick(PRAISE);
  speakNow([[p[0],'vi'],[r.win.vi,'vi'],[p[1],'en'],[r.win.en,'en']].concat(S.lang==='vi'&&r.wx?r.wx:[]));
  S.round++;setProgress(S.round,S.total);
  var nb=$('#next');if(nb)nb.hidden=false;
  S.timer=setTimeout(goNext,6000);
}
function answer(i,el){
  if(i===S.cur.correct){succeed(el)}
  else{
    sfx('no');el.classList.add('wrong','dim');el.disabled=true;
    setTimeout(function(){el.classList.remove('wrong')},500);
    speakNow([['Ồ, thử lại nhé!','vi'],['Oops, try again!','en']]);
  }
}
function showEnd(){
  stop3D();clearTimeout(S.timer);S.cur=null;
  S.stars+=S.total;
  var owned=function(x){return S.stickers.indexOf(x)>=0};
  var isCarSt=function(x){return x.indexOf('car:')===0};
  var spec=function(x){return x==='car:kim'||x==='car:chop'};
  var nCars=ALBUM.filter(function(x){return isCarSt(x)&&!spec(x)&&owned(x)}).length;
  var fresh=ALBUM.filter(function(x){return !spec(x)&&!owned(x)});
  var freshCars=fresh.filter(isCarSt),st;
  var ms=todayMission(),missionNow=false;
  if(S.mday!==todayStr()&&(S.mode===ms[0]||S.mode==='mix')){missionNow=true;S.mday=todayStr();S.mtotal=(S.mtotal||0)+1;S.stars+=3}
  if(missionNow&&!owned('car:chop')){st='car:chop'}
  else if(nCars>=10&&!owned('car:kim')){st='car:kim'}
  else if(!fresh.length){st=pick(ALBUM.filter(function(x){return !spec(x)}))}
  else{st=pick(fresh)}
  var isNew=!owned(st);
  if(isNew)S.stickers.push(st);
  save();
  var stars='';for(var i=0;i<Math.min(S.total,10);i++)stars+='⭐';
  setProgress(S.total,S.total);syncControls();
  var both=S.lang==='both',en1=S.lang==='en',car=st.indexOf('car:')===0?CARS[st.slice(4)]:null;
  var gotVi,gotEn;
  if(st==='car:chop'&&isNew){gotVi='Sticker đặc biệt! Rookie làm bạn với bé!';gotEn='Special sticker! Rookie is your friend now!'}
  else if(st==='car:kim'&&isNew){gotVi='Sticker đặc biệt! Siêu xe vàng Kim!';gotEn='Special sticker! Kim the golden super car!'}
  else if(car){gotVi='Bé nhận được chú xe '+car.name+'!';gotEn='You got '+car.name+' the '+car.en+'!'}
  else if(st.indexOf('hero:')===0){var hr=HEROES[st.slice(5)];gotVi='Bé nhận được '+hr.vi+'!';gotEn='You got '+hr.en+'!'}
  else{gotVi='Bé nhận được nhãn dán mới!';gotEn='You won a new sticker!'}
  var btns='<button class="next" data-act="again">Chơi tiếp ▶<small>Play again</small></button>';
  if(car)btns+='<button class="next blue" data-act="show3d" data-car="'+st.slice(4)+'">🚗 Xem xe 3D<small>See it in 3D</small></button>';
  btns+='<button class="next alt" data-act="album">📒 Album<small>Sticker book</small></button>'
       +'<button class="next alt" data-act="home">🏠 Về nhà<small>Home</small></button>';
  view.innerHTML='<section class="end">'
    +'<div class="sticker" aria-hidden="true">'+stkHTML(st)+'</div>'
    +'<h2>'+(en1?'Hooray! You did it!':'Hoan hô! Bé giỏi quá!')+'</h2>'
    +(both?'<p>Hooray! You did it!</p>':'')
    +'<div class="stars" aria-label="Sao">'+stars+'</div>'
    +'<p class="cname">'+(en1?gotEn:gotVi+(both?' · '+gotEn:''))+'</p>'
    +(missionNow?'<p class="mdone">🎉 '+(en1?'Rookie’s mission complete! +3 stars':'Xong nhiệm vụ của Rookie! +3 sao'+(both?' · Mission complete! +3 stars':''))+'</p>':'')
    +'<div class="endbtns">'+btns+'</div></section>';
  sfx('win');
  var w=window.innerWidth,h=window.innerHeight;
  confetti(w*.3,h*.35,true);confetti(w*.7,h*.35,true);
  speakNow([['Hoan hô! Bé giỏi quá!','vi']].concat(missionNow?[['Xong nhiệm vụ rồi!','vi']]:[],[[gotVi,'vi']],car?[[car.honk,'vi']]:[],
    [['Hooray! You did it!','en']],missionNow?[['Mission complete!','en']]:[],[[gotEn,'en']]));
}

function bkCode(){return 'BVH1:'+btoa(unescape(encodeURIComponent(JSON.stringify(bkData()))))}
function bkParse(txt){
  var j;txt=String(txt||'').trim();
  try{if(txt.indexOf('BVH1:')===0)txt=decodeURIComponent(escape(atob(txt.slice(5).replace(/\s+/g,''))));j=JSON.parse(txt)}catch(e){return null}
  if(!j||j.app!=='behuihoc'||!j.data||!Array.isArray(j.data.stickers))return null;
  return j.data;
}

  var o={stars:Math.max(0,+d.stars||0),stickers:d.stickers.filter(function(x){return typeof x==='string'}),mday:String(d.mday||''),mtotal:+d.mtotal||0,sound:d.sound!==false,lang:(d.lang==='vi'||d.lang==='en')?d.lang:'both',level:(d.level>=1&&d.level<=3)?d.level:2};
  try{localStorage.setItem('behuihoc',JSON.stringify(o))}catch(e){return false}
  load();syncControls();return true;
}

function doRestore(txt){
  var d=bkParse(txt);
  if(!d){setMsg('Mã hoặc file này không đúng. Hãy thử lại nhé.',true);return}
  if(!window.confirm('Khôi phục sẽ thay thế sao và nhãn dán hiện tại của bé. Tiếp tục?'))return;
  if(bkApply(d)){showSettings();setMsg('Đã khôi phục xong! Bé có '+S.stars+' ⭐ và '+S.stickers.length+' nhãn dán.')}
  else setMsg('Máy không cho lưu dữ liệu. Hãy thử lại.',true);
}
function doBackupFile(){
  var code=JSON.stringify(bkData(),null,1),name='be-vui-hoc-sao-luu-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var blob=new Blob([code],{type:'application/json'});
    var file=null;try{file=new File([blob],name,{type:'application/json'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      navigator.share({files:[file],title:'Sao lưu Bé Vui Học'}).then(function(){bkMark();showSettings();setMsg('Đã lưu file sao lưu.')}).catch(function(){});
      return;
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    bkMark();setMsg('Đã tạo file sao lưu: '+name);
  }catch(e){setMsg('Không tạo được file. Hãy dùng nút Sao chép mã nhé.',true)}
}
function doBackupCopy(){
  var code=bkCode(),ta=$('#bkcode');if(ta){ta.value=code}
  var done=function(){bkMark();setMsg('Đã sao chép mã! Hãy dán vào Ghi chú hoặc tin nhắn để cất giữ.')};
  var fb=function(){try{ta.focus();ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,code.length);var ok=document.execCommand('copy');ta.setAttribute('readonly','');if(ok)done();else{bkMark();setMsg('Hãy chạm giữ vào ô mã rồi chọn Sao chép.')}}catch(e){setMsg('Hãy chạm giữ vào ô mã rồi chọn Sao chép.')}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,fb)}else fb();
}

view.addEventListener('click',function(e){
  var t=e.target;
  var lv=t.closest('[data-level]');
  if(lv){S.level=+lv.getAttribute('data-level');save();sfx('pop');if(S.mode==='settings')showSettings();else showHome();return}
  var lg=t.closest('button[data-lang]');if(lg){sfx('pop');setLang(lg.getAttribute('data-lang'));return}
  var m=t.closest('[data-mode]');if(m){startGame(m.getAttribute('data-mode'));return}
  var act=t.closest('[data-act]');
  if(act){
    var a=act.getAttribute('data-act');
    if(a==='again')startGame(S.mode);
    else if(a==='home')showHome();
    else if(a==='album')showAlbum();
    else if(a==='count')countStickers();
    else if(a==='snd'){S.sound=!S.sound;if(!S.sound)stopSpeech();save();syncControls();showSettings()}
    else if(a==='sndtest')doSndTest();
    else if(a==='bkfile')doBackupFile();
    else if(a==='bkcopy')doBackupCopy();
    else if(a==='bkrestore')doRestore(($('#bkpaste')||{}).value);
    else if(a==='bkreset'){
      if(window.confirm('Xoá hết sao và nhãn dán của bé? Việc này không hoàn tác được.')&&window.confirm('Chắc chắn xoá nhé?')){S.stars=0;S.stickers=[];S.mday='';S.mtotal=0;save();load();showSettings();setMsg('Đã xoá tiến trình.')}
    }
    else if(a==='show3d'){closeChat();openShowroom(act.getAttribute('data-car'))}
    else if(a==='chatmore')chatSay(CHATID,true);
    else if(a==='chatclose')closeChat();
    return;
  }
  var sk=t.closest('[data-stk]');if(sk){stkTap(sk);return}
  var ac=t.closest('[data-car]');if(ac){openCarChat(ac.getAttribute('data-car'));return}
  var sw=t.closest('.sw');
  if(sw&&D&&D.car){
    D.car.userData.body.color.set(sw.getAttribute('data-hex'));
    sfx('pop');speakNow([['màu '+sw.getAttribute('data-vi'),'vi'],[sw.getAttribute('data-en'),'en']]);return;
  }
  if(t.closest('#drvSay')){driveSay();return}
  if(!S.cur)return;
  var spk=t.closest('.spk');
  if(spk){var o=S.cur.opts[+spk.getAttribute('data-s')];if(o&&o.say){sfx('pop');speakNow(o.say)}return}
  var opt=t.closest('.opt');
  if(opt&&!S.locked){answer(+opt.getAttribute('data-i'),opt);return}
  if(t.closest('#replay')){speakNow(sayPrompt(S.cur));return}
  if(t.closest('#bubble')){sfx('pop');speakNow(S.cur.snd);return}
  if(t.closest('#next')){goNext();return}
  var pk=t.closest('.item.pick');
  if(pk&&!S.locked){
    pk.classList.toggle('sel');
    S.sel=document.querySelectorAll('.item.pick.sel').length;
    sfx('pop');
    if(S.sel>0)speakNow(S.cur.enc?[[NUM_EN[S.sel],'en',true]]:[[NUM_VI[S.sel],'vi'],[NUM_EN[S.sel],'en']]);
    if(S.sel===S.cur.goal)succeed(null);
    return;
  }
  var it=t.closest('.item');
  if(it&&!it.classList.contains('counted')&&!it.classList.contains('pick')){
    S.count++;it.setAttribute('data-n',S.count);it.classList.add('counted');
    sfx('pop');speakNow(S.cur.enc?[[NUM_EN[S.count],'en',true]]:[[NUM_VI[S.count],'vi'],[NUM_EN[S.count],'en']]);
  }
});
$('#homeBtn').addEventListener('click',showHome);
$('#setBtn').addEventListener('click',function(){sfx('pop');showSettings()});
$('#soundBtn').addEventListener('click',function(){
  S.sound=!S.sound;if(!S.sound)stopSpeech();save();syncControls();
});
function setLang(l){
  S.lang=l;save();syncControls();stopSpeech();
  if(S.cur&&!S.locked){renderRound(S.cur)}else if(!S.mode){showHome()}else if(S.mode==='album'){showAlbum()}else if(S.mode==='settings'){showSettings()}
}
$('#langBtn').addEventListener('click',function(){setLang(S.lang==='both'?'vi':(S.lang==='vi'?'en':'both'))});
var woke=false;
function wake(){if(woke)return;woke=true;ensureAC();mediaUnlock();unlockSpeech()}
document.addEventListener('touchend',wake,{once:true,passive:true});
document.addEventListener('click',wake,{once:true});
/* stop iPhone/iPad pinch-zoom while a child is tapping */
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('dblclick',function(e){e.preventDefault()});

if(/[?&]debug/.test(location.search)){window.__bvh={getD:function(){return D},sayPrompt:sayPrompt,PRAISE:PRAISE,chatLines:chatLines,NUM_VI:NUM_VI,NUM_EN:NUM_EN,HEROES:HEROES,COLORS:COLORS,TOPICS:TOPICS,MISSIONS:MISSIONS,make3DCar:make3DCar,carSVG:carSVG,S:S,POOL:POOL,TOPIC_IDS:TOPIC_IDS,CARS:CARS,CARIDS:CARIDS,ALBUM:ALBUM,startGame:startGame,showAlbum:showAlbum,openShowroom:openShowroom,showEnd:showEnd,goNext:goNext}}
/* English-only mode: drop the Vietnamese half of "vi + en" texts */
var LETRE=/[A-Za-zÀ-ỹ]/;
function localize(root){
  if(S.lang!=='en')return;
  root.querySelectorAll('i,small').forEach(function(sm){
    var P=sm.parentNode;if(!P||P.getAttribute('data-loc'))return;
    P.setAttribute('data-loc','1');
    for(var n=P.firstChild;n;n=n.nextSibling){
      if(n.nodeType===3&&LETRE.test(n.nodeValue)){var m=n.nodeValue.match(/^[^A-Za-zÀ-ỹ]*/);n.nodeValue=m?m[0]:''}
    }
    P.classList.add('enonly');
  });
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),t,list=[];
  while((t=w.nextNode()))if(/[À-ỹ]/.test(t.nodeValue)&&t.nodeValue.indexOf('·')>=0)list.push(t);
  list.forEach(function(t){var a=t.nodeValue.split('·');t.nodeValue=a[a.length-1].trim()});
}
try{new MutationObserver(function(){localize(view)}).observe(view,{childList:true,subtree:true})}catch(e){}
syncControls();
showHome();
})();
</script>
